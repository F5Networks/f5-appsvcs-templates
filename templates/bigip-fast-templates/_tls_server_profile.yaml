bigipHideTemplate: true

tls_server_base: &tls_server_base
  title: TLS Server Profile
  contentType: application/json
  parameters:
    tls_server_sni_cert_names: []
  definitions: &tls_server_base_def
    enable_tls_server:
      title: TLS Server
      description: Enable TLS server to decrypt client-side connections.
      type: boolean
      default: true
    make_tls_server_profile:
      title: FAST-Generated TLS Server Profile
      description: Uncheck to use an existing BIG-IP TLS server profile.
      type: boolean
      default: true
    make_tls_server_sni_profile:
      title: Use Server Name Indication (SNI)
      type: boolean
      default: false
    tls_cert_name:
      title: TLS Certificate
      description: Select an existing BIG-IP SSL certificate.
      enumFromBigip: sys/crypto/cert
      default: "/Common/default.crt"
    tls_key_name:
      title: TLS Key
      description: Select an existing BIG-IP SSL key.
      enumFromBigip: sys/crypto/key
      default: "/Common/default.key"
    tls_server_sni_cert_names:
      title: TLS Server Profiles w/SNI
      description: Create multiple SNI Profiles; the first one will be used as the SNI default
      type: array
      uniqueItems: true
      default:
        - {}
      items:
        type: object
        properties:
          tls_sni_fqdn:
            title: Server Name
            description: FQDN to match in request
            format: hostname
            type: string
          tls_cert:
            title: TLS Certificate
            description: Select an existing BIG-IP SSL certificate.
            enumFromBigip: sys/crypto/cert
            default: "/Common/default.crt"
          tls_key:
            title: TLS Key
            description: Select an existing BIG-IP SSL key.
            enumFromBigip: sys/crypto/key
            default: "/Common/default.key"
    tls_server_use_sni:
      title: Use Server Name Indication (SNI)
      type: boolean
      default: false
    tls_server_profile_name:
      title: TLS Server Profile
      description: Select an existing TLS server profile. TLS server profiles are of type "ltm clientssl" on BIG-IP.
      enumFromBigip: ltm/profile/client-ssl
      default: "/Common/clientssl"
    tls_server_sni_profile_names:
      title: TLS Server Profiles w/SNI
      description: Select multiple SNI TLS Server Profiles. Exactly one of these existing TLS Server Profile must be set as the SNI default
      type: array
      uniqueItems: true
      default:
        - {}
      minItems: 1
      items:
        type: object
        properties:
          tls_server_sni_profile:
            title: TLS Server Profile
            description: Select an existing TLS server profile. TLS server profiles are of type "ltm clientssl" on BIG-IP.
            enumFromBigip: ltm/profile/client-ssl
            default: "/Common/clientssl"
    tls_server_partial_template:
      template: |
        {{#enable_tls_server}}
          {{#make_tls_server_profile}}
            {{#make_tls_server_sni_profile}}
              {{#tls_server_sni_cert_names}}
                "{{tls_sni_fqdn}}_certificate": {
                  "class": "Certificate",
                  "certificate": { "bigip": "{{tls_cert}}" },
                  "privateKey": { "bigip": "{{tls_key}}" }
                },
              {{/tls_server_sni_cert_names}}
              "{{app_name}}_tls_server": {
                "class": "TLS_Server",
                "certificates": [
                  {{#tls_server_sni_cert_names}}
                    {
                      "certificate": "{{tls_sni_fqdn}}_certificate",
                      "matchToSNI": "{{tls_sni_fqdn}}"
                    },
                  {{/tls_server_sni_cert_names}}
                ]
              },
              "{{app_name}}": {
                "class": "Service_HTTPS",
                "serverTLS": "{{app_name}}_tls_server"
              },
            {{/make_tls_server_sni_profile}}
            {{^make_tls_server_sni_profile}}
              "{{app_name}}_tls_server": {
                "class": "TLS_Server",
                "certificates": [{ "certificate": "{{app_name}}_certificate" }]
              },
              "{{app_name}}_certificate": {
                "class": "Certificate",
                "certificate": { "bigip": "{{tls_cert_name}}" },
                "privateKey": { "bigip": "{{tls_key_name}}" }
              },
              "{{app_name}}": {
                "class": "Service_HTTPS",
                "serverTLS": "{{app_name}}_tls_server"
              },
            {{/make_tls_server_sni_profile}}
          {{/make_tls_server_profile}}
          {{^make_tls_server_profile}}
            {{#tls_server_use_sni}}
              "{{app_name}}": {
                "class": "Service_HTTPS",
                "serverTLS": [
                  {{#tls_server_sni_profile_names}}
                    { "bigip": "{{tls_server_sni_profile}}" },
                  {{/tls_server_sni_profile_names}}
                ]
              }
            {{/tls_server_use_sni}}
            {{^tls_server_use_sni}}
              "{{app_name}}": {
                "class": "Service_HTTPS",
                "serverTLS": 
                  { "bigip": "{{tls_server_profile_name}}" }
              }
            {{/tls_server_use_sni}}
          {{/make_tls_server_profile}}
        {{/enable_tls_server}}
        {{^enable_tls_server}}
          "{{app_name}}": {
            "class": "Service_HTTP"
          }
        {{/enable_tls_server}}
  template: |
    {
      "{{tenant_name}}": {
        "{{app_name}}": {
          {{>tls_server_partial_template}}
        }
      }
    }

# default TLS Server subTemplate
<<: *tls_server_base

# fastL4 version of the TLS Server subTemplate
fastl4:
  <<: *tls_server_base
  template: |
    {
      "{{tenant_name}}": {
        "{{app_name}}": {
          {{^fastl4}}
            {{>tls_server_partial_template}}
          {{/fastl4}}
        }
      }
    }
